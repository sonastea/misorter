<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("theme");
        } catch {
          // Storage can be unavailable in private or restricted contexts.
        }
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/Merriweather-Sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="title" content="misorter" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <title>misorter</title>
    <script
      async
      src="https://analytics.sonastea.com/script.js"
      data-cache="true"
      data-domains="www.misorter.com,misorter.com"
      data-website-id="9147fb3a-6922-4859-8bb8-d98d54ebc2fa"
    ></script>
  </head>

    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
